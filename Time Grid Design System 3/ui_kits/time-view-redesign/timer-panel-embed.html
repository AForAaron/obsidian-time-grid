function genMonth(now){

    {name:'会议',mins:40,color:'var(--tg-viz-3)'},

  });
  heatBlock.appendChild(h('div','c-head-row',null,[h('div','c-head-title',{text:'长期轨迹'}),pills]));
  heatBlock.appendChild(h('div','c-month-meta',{text:'记录 '+recorded+' 天',style:'margin:4px 0 6px'}));
  heatBlock.appendChild(buildHeatmap(weeks,false));
  split.appendChild(heatBlock);
  const monthBlock=h('div',null);
  monthBlock.appendChild(h('div','c-head-row',null,[h('div','c-head-title',{text:'本月位置'}),h('div','c-month-meta',{text:(nw.getMonth()+1)+'月 · 第'+nw.getDate()+'天'})]));
  monthBlock.appendChild(h('div',null,{style:'margin-top:6px'},[buildMonth(genMonth(nw),nw)]));
  split.appendChild(monthBlock);
  wrap.appendChild(split);

  const dp=dayProgress(nw);
  const dialWrap=h('div','c-dial-wrap');
  dialWrap.appendChild(buildDial(nw));
  dialWrap.appendChild(h('div','c-dial-center',{html:pad2(nw.getHours())+':'+pad2(nw.getMinutes())+':'+pad2(nw.getSeconds())+'<small>今天已过 '+dp.pct+'% · 还剩 '+dp.remainStr+'</small>'}));
  wrap.appendChild(dialWrap);

  wrap.appendChild(timerMount);

  const gotoBlock=h('div',null);
  gotoBlock.appendChild(h('div','c-head-title',{text:'今日去向',style:'margin-bottom:8px'}));
  gotoBlock.appendChild(buildActivityBar(st.dataState));
  wrap.appendChild(gotoBlock);

  root.appendChild(wrap);
  updateTimerPanel();
}
document.querySelectorAll('[data-w]').forEach(btn=>btn.addEventListener('click',()=>{
  st.width=parseInt(btn.dataset.w,10);
  document.querySelectorAll('[data-w]').forEach(b=>b.classList.toggle('active',b===btn));
  document.getElementById('vp').style.width=st.width+'px';
}));
document.querySelectorAll('[data-theme]').forEach(btn=>btn.addEventListener('click',()=>{
  st.theme=btn.dataset.theme;
  document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('active',b===btn));
  document.body.classList.toggle('theme-light',st.theme==='light');
}));
document.getElementById('stateSelect').addEventListener('change',e=>{st.dataState=e.target.value;render();});
document.querySelectorAll('[data-ts]').forEach(btn=>btn.addEventListener('click',()=>{
  st.timerState=btn.dataset.ts;st.justSwitched=null;
  document.querySelectorAll('[data-ts]').forEach(b=>b.classList.toggle('active',b===btn));
  render();
}));
document.getElementById('vp').style.width='320px';
render();
setInterval(()=>{if(st.timerState==='running'){st.elapsedSec++;updateTimerPanel();}},1000);
</script>
</body></html>
