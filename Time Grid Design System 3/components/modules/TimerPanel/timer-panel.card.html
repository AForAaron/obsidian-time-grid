<!-- @dsCard group="Components" viewport="1400x760" name="Timer Panel" subtitle="All 6 states: Idle, Running, Conflict, Invalid, Write Error, Recovery" -->
<html><head><link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-app);padding:22px;font-family:var(--font-ui)}.grid{display:grid;grid-template-columns:repeat(3,320px);gap:20px}.cell{display:flex;flex-direction:column;gap:8px}.cell-label{font-size:11px;color:var(--text-faint)}.dim{grid-column:1/-1;font-size:11px;color:var(--text-faint);margin-top:4px;line-height:1.6}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { TimerPanel } = window.TimeGridDesignSystem_80c9b5;
const suggestions = { recent: ['写代码', '阅读', '会议'], tasks: ['修好日历同步脚本', 'Review 文案'], routines: ['晨间复盘'] };
ReactDOM.createRoot(document.getElementById('root')).render(<React.Fragment>
  <div className="grid">
    <div className="cell"><div className="cell-label">1 · 空闲</div><TimerPanel state="idle" idleHint="none" suggestions={suggestions} /></div>
    <div className="cell"><div className="cell-label">1b · 空闲 · 无日记</div><TimerPanel state="idle" idleHint="no-diary" suggestions={suggestions} /></div>
    <div className="cell"><div className="cell-label">1c · 空闲 · 无计时块</div><TimerPanel state="idle" idleHint="no-tracker" suggestions={suggestions} /></div>
    <div className="cell"><div className="cell-label">2 · 运行中</div><TimerPanel state="running" activityName="写代码" startedAt="14:05" elapsed="01:24:08" suggestions={suggestions} /></div>
    <div className="cell"><div className="cell-label">2b · 运行中 · 刚切换</div><TimerPanel state="running" activityName="写代码" startedAt="15:41" elapsed="00:02:14" justSwitched={{ from: '阅读', to: '写代码' }} suggestions={suggestions} /></div>
    <div className="cell"><div className="cell-label">3 · 冲突</div><TimerPanel state="conflict" conflictItems={[{ name: '写代码', duration: '1h24m' }, { name: '阅读', duration: '12m' }]} /></div>
    <div className="cell"><div className="cell-label">4 · 计时不可用</div><TimerPanel state="invalid" invalidReason="simple-time-tracker 格式有误" /></div>
    <div className="cell"><div className="cell-label">5 · 写入失败</div><TimerPanel state="writeError" writeErrorReason="日记在写入前发生变化" /></div>
    <div className="cell"><div className="cell-label">6 · 跨日恢复</div><TimerPanel state="recovery" recoveryActivity="写代码" recoveryDuration="31 小时 20 分" recoveryDays={[{ label: '8月1日 · 首日', role: '结束于 24:00' }, { label: '8月2日 · 今日', role: '从 00:00 继续' }]} /></div>
    <div className="dim">尺寸标注：输入高 36px · 主按钮高 36px · Quiet 按钮高 30px · 建议芯片高约 27px · 面板圆角 8px。运行中边框暖化混入 --tg-today-ring；冲突/异常/写入失败边框混入错误色，克制不刺眼。</div>
  </div>
</React.Fragment>);
</script>
</body></html>
