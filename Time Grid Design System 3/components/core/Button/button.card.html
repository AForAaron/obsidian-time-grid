<div id="root"></div>
<script type="text/babel" data-presets="react">
const { Button } = window.TimeGridDesignSystem_80c9b5;
const Play = () => <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M7 4l14 8-14 8z"/></svg>;
const Stop = () => <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>;
ReactDOM.createRoot(document.getElementById('root')).render(<React.Fragment>
  <div className="row"><span className="row-label">Primary · 36px</span><Button variant="primary" icon={<Play/>}>开始</Button><Button variant="primary">补齐并继续</Button><Button variant="primary" disabled icon={<Play/>}>开始</Button></div>
  <div className="row"><span className="row-label">Neutral / Switch · 36px</span><Button variant="neutral">切换</Button><Button variant="neutral">首个午夜结束</Button><Button variant="neutral" disabled>切换</Button></div>
