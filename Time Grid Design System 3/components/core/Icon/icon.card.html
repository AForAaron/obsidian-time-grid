<html><head><link rel="stylesheet" href="../../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-ui)}.row{display:flex;gap:28px;align-items:center;padding:28px;flex-wrap:wrap}.item{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-muted);font-size:11px}.box{width:40px;height:40px;border-radius:var(--radius-md);border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;background:var(--surface-panel)}</style>
</head><body>
<div class="row" id="root"></div>
<script type="text/babel">
const { Icon } = window.TimeGrid;
const names = ['month','day','hour','pie','chevronLeft','chevronRight'];
ReactDOM.createRoot(document.getElementById('root')).render(
  names.map(n => (
    <div className="item" key={n}>
      <div className="box"><Icon name={n} size={20} /></div>
      <span>{n}</span>
    </div>
  ))
);
</script>
</body></html>
