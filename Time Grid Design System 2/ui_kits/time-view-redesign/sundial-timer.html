  <div class="review-group"><span class="review-label">计时状态</span><select class="review-select" id="stateSelect"><option value="idle">空闲</option><option value="no-diary">无日记 · 自动创建</option><option value="no-tracker">无计时块 · 自动插入</option><option value="running" selected>运行中</option><option value="switched">刚刚切换</option><option value="conflict">多个运行项冲突</option><option value="invalid">JSON格式异常</option><option value="write-error">写入失败</option><option value="recovery">跨日超过24小时</option></select></div>

</div>
<div class="stage">
  <aside class="annotation"><div class="annotation-kicker">Selected direction 03</div><h1>此刻回环</h1><p>长期轨迹始终在场，但只占据安静的顶部。日晷把今天与当前小时收束到同一个中心；计时直接回答“此刻正在做什么”。</p><p>开始、停止与切换紧贴日晷，完成动作后视线自然落到“今日去向”。没有效率评价，也没有奖励，只陈述时间已经如何经过。</p><hr class="annotation-rule"><ul class="annotation-list"><li>外弧：今天24小时</li><li>内弧：当前60分钟</li><li>暖点：不可停留的此刻</li><li>单一运行活动</li><li>日记仍是数据真相源</li><li>异常时拒绝静默覆盖</li></ul></aside>
  <section class="device" aria-label="Time Grid Obsidian右侧面板原型"><div class="device-chrome"><span>Time Grid</span><span class="device-dots"><i class="device-dot"></i><i class="device-dot"></i><i class="device-dot"></i></span></div><div class="device-tabs" role="tablist"><button class="device-tab is-active" role="tab" aria-selected="true">时间</button><button class="device-tab" role="tab" aria-selected="false">任务</button></div><div class="viewport" id="viewport"><div class="time-view" id="timeView"></div></div></section>
</div>
</main>

function renderContext(root,now){const top=h('div','top-context'),trend=h('section','context-block'),hd=h('div','section-head'),ranges=h('div','range-switch');hd.appendChild(h('div','section-label','长期轨迹'));[['3m','3个月'],['6m','6个月'],['1y','1年']].forEach(([key,label])=>{const b=h('button','range-button'+(state.range===key?' is-active':''),label);b.onclick=()=>{state.range=key;localStorage.setItem('tg-sundial-range',key);render()};ranges.appendChild(b)});hd.appendChild(ranges);trend.append(hd,heatmap(now));const month=h('section','context-block');month.append(head('本月位置',`${now.getMonth()+1}月 · 第${now.getDate()}天`),calendar(now));top.append(trend,month);root.appendChild(top)}
function heatmap(now){const weeks=state.range==='3m'?13:state.range==='1y'?52:26,rand=seeded(27),end=new Date(now);end.setHours(0,0,0,0);const monday=new Date(end),dow=end.getDay()===0?6:end.getDay()-1;monday.setDate(end.getDate()-dow-(weeks-1)*7);const wrap=h('div'),layout=h('div','heat-layout'),days=h('div','heat-weekdays');['一','','三','','五','','日'].forEach(x=>days.appendChild(h('span','',x)));layout.appendChild(days);const scroll=h('div','heat-scroll'),grid=h('div','heat-grid');let active=0;for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){const date=new Date(monday);date.setDate(monday.getDate()+w*7+d);const future=date>end,today=date.getTime()===end.getTime();let level=0;if(!future){const r=rand();level=r<.2?0:r<.44?1:r<.7?2:r<.9?3:4;if(level)active++}const cell=h('button',`heat-cell level-${level}${future?' is-future':''}${today?' is-today':''}`);cell.disabled=future;cell.setAttribute('aria-label',`${dateLabel(date)} · ${level?'活动等级'+level:'无记录'}`);if(!future){cell.onclick=()=>toast(`模拟打开 ${dateLabel(date)} 日记`);cell.onmouseenter=e=>showTip(e,date,level);cell.onmousemove=moveTip;cell.onmouseleave=hideTip}grid.appendChild(cell)}scroll.appendChild(grid);layout.appendChild(scroll);wrap.append(layout,h('div','section-meta',`记录 ${active} 天 · 净增 12,840字`));const legend=h('div','heat-legend'),cells=h('span','heat-legend-cells');for(let i=0;i<5;i++)cells.appendChild(h('i','heat-legend-cell'));legend.append(h('span','','少'),cells,h('span','','多'));wrap.appendChild(legend);requestAnimationFrame(()=>scroll.scrollLeft=scroll.scrollWidth);return wrap}
function showTip(e,d,l){const tip=$('#heatTooltip');tip.innerHTML=`<strong>${dateLabel(d)}</strong>${l?`记录约 ${l*38}m · 净增 ${l*126}字`:'没有记录'}`;tip.style.display='block';moveTip(e)}function moveTip(e){const tip=$('#heatTooltip');tip.style.left=`${e.clientX+12}px`;tip.style.top=`${e.clientY+12}px`}function hideTip(){$('#heatTooltip').style.display='none'}
function calendar(now){const grid=h('div','calendar');['日','一','二','三','四','五','六'].forEach(x=>grid.appendChild(h('div','calendar-weekday',x)));const first=new Date(now.getFullYear(),now.getMonth(),1).getDay(),total=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();for(let i=0;i<first;i++)grid.appendChild(h('span','calendar-day is-empty'));for(let d=1;d<=total;d++){const c=d<now.getDate()?' is-past':d===now.getDate()?' is-today':' is-future',b=h('button','calendar-day'+c,String(d));b.onclick=()=>toast(`模拟打开 ${now.getMonth()+1}月${d}日 日记`);grid.appendChild(b)}return grid}
function polar(cx,cy,r,deg){const a=(deg-180)*Math.PI/180;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}}function arc(cx,cy,r,a,b){const s=polar(cx,cy,r,a),e=polar(cx,cy,r,b);return`M ${s.x} ${s.y} A ${r} ${r} 0 0 1 ${e.x} ${e.y}`}function svg(tag,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e}
function dial(now){const s=svg('svg',{viewBox:'0 0 280 148',class:'dial-svg'}),cx=140,cy=126,R=106,r=72,day=(now.getHours()*3600+now.getMinutes()*60+now.getSeconds())/86400,min=(now.getMinutes()*60+now.getSeconds())/3600;s.append(svg('path',{d:arc(cx,cy,R,0,180),class:'dial-track','stroke-width':6}),svg('path',{d:arc(cx,cy,R,0,Math.max(.001,day*180)),class:'dial-day','stroke-width':6}),svg('path',{d:arc(cx,cy,r,0,180),class:'dial-track','stroke-width':5}),svg('path',{d:arc(cx,cy,r,0,Math.max(.001,min*180)),class:'dial-hour','stroke-width':5}));const p=polar(cx,cy,R,day*180);s.appendChild(svg('circle',{cx:p.x,cy:p.y,r:4.2,class:'dial-now'}));['00','06','12','18','24'].forEach((x,i)=>{const p=polar(cx,cy,R+16,i*45),t=svg('text',{x:p.x,y:p.y+3,class:'dial-tick'});t.textContent=x;s.appendChild(t)});return s}
function nowZone(root,now){const zone=h('section','now-zone'),d=h('div','dial-panel'),labels=h('div','dial-label-row');labels.append(h('div','section-label','此刻'),h('div','section-meta','今日 · 当前小时'));d.append(labels,dial(now));const cap=h('div','dial-caption'),sec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds(),remain=86400-sec;cap.append(h('div','dial-clock',clock(now)),h('div','dial-summary',`今天已过 ${Math.floor(sec/864)}% · 还剩 ${Math.floor(remain/3600)}h ${Math.floor(remain%3600/60)}m`));d.appendChild(cap);zone.append(d,timer(now));root.appendChild(zone)}
function timer(now){const mode=state.timerState,p=h('section',`timer-panel${['running','switched'].includes(mode)?' is-running':''}${['conflict','invalid','write-error'].includes(mode)?' is-error':''}`);if(['idle','no-diary','no-tracker'].includes(mode))idleTimer(p,mode);else if(['running','switched'].includes(mode))runningTimer(p,mode,now);else if(mode==='conflict')conflict(p);else if(mode==='invalid')invalid(p);else if(mode==='write-error')writeError(p);else recovery(p);return p}
function timerHead(title,right){const e=h('div','timer-head'),left=h('div','timer-eyebrow',title);e.appendChild(left);if(right)e.appendChild(right);return e}function playButton(text,primary=false){const b=h('button','action-button'+(primary?' primary':' '));b.type='submit';b.append(h('i','play-icon'),document.createTextNode(text));return b}
function idleTimer(p,mode){p.appendChild(timerHead('开始计时'));const f=h('form','timer-form'),i=h('input','timer-input');i.placeholder='此刻在做什么？';const b=playButton('开始',true);f.append(i,b);f.onsubmit=e=>{e.preventDefault();start(i.value.trim()||'写代码',mode)};p.appendChild(f);if(mode==='no-diary')p.appendChild(h('div','timer-helper','开始后将创建今日日记，并写入“时间记录”计时块。'));if(mode==='no-tracker')p.appendChild(h('div','timer-helper','开始后将写入模板标记；没有标记时追加到日记末尾。'));p.appendChild(suggestionList(name=>start(name,mode)))}
function runningTimer(p,mode,now){const tm=h('div','timer-elapsed',elapsed(now-state.startedAt)),hd=timerHead('正在计时',tm);hd.firstChild.prepend(h('i','live-dot'));p.appendChild(hd);const main=h('div','timer-running-main'),info=h('div');info.append(h('div','running-name',state.activity),h('div','running-since',`开始于 ${clock(new Date(state.startedAt)).slice(0,5)} · 关闭 Obsidian 后仍继续`));const stop=h('button','action-button danger');stop.append(h('i','stop-icon'),document.createTextNode('停止'));stop.onclick=()=>{state.timerState='idle';$('#stateSelect').value='idle';render();toast(`${state.activity} 已停止 · 原型未写入日记`)};main.append(info,stop);p.appendChild(main);if(mode==='switched')p.appendChild(h('div','timer-helper','已在同一时刻结束“阅读”，并开始“写代码”。'));p.appendChild(h('div','switch-label','切换活动 · 开始新活动会自动结束当前活动'));const f=h('form','timer-form'),i=h('input','timer-input');i.placeholder='输入新的活动';const b=playButton('切换');f.append(i,b);f.onsubmit=e=>{e.preventDefault();switchTo(i.value.trim()||'阅读')};p.append(f,suggestionList(switchTo))}
function suggestionList(onPick){const wrap=h('div','suggestions');suggestions.forEach(([label,items])=>{const g=h('div','suggestion-group'),list=h('div','suggestion-list');g.appendChild(h('span','suggestion-label',label));items.forEach(name=>{const b=h('button','suggestion',name);b.onclick=()=>onPick(name);list.appendChild(b)});g.appendChild(list);wrap.appendChild(g)});return wrap}
function start(name,mode){if(mode==='no-diary'||mode==='no-tracker'){toast(mode==='no-diary'?'正在创建今日日记与计时块…':'正在插入计时块…');setTimeout(()=>begin(name),650)}else begin(name)}function begin(name){state.activity=name;state.startedAt=Date.now();state.timerState='running';$('#stateSelect').value='running';render();toast(`${name} 已开始 · 原型模拟`)}function switchTo(name){state.activity=name;state.startedAt=Date.now();state.timerState='switched';$('#stateSelect').value='switched';render();toast(`已切换到 ${name}`)}
function notice(title,copy,rows,actions){const c=h('div','notice-card');c.append(h('div','notice-title',title),h('div','notice-copy',copy));if(rows){const list=h('div','notice-list');rows.forEach(([a,b])=>{const r=h('div','notice-row');r.append(h('strong','',a),h('span','',b));list.appendChild(r)});c.appendChild(list)}const box=h('div','notice-actions');actions.forEach(([label,fn,kind=''])=>{const b=h('button',`action-button quiet ${kind}`,label);b.onclick=fn;box.appendChild(b)});c.appendChild(box);return c}
function conflict(p){p.append(timerHead('计时冲突'),notice('发现 2 个活动正在运行','Time Grid 不会自动覆盖。结束全部后，才能开始新的活动。',[['写代码','01:12:08'],['阅读','00:26:41']],[['结束全部并继续',()=>setMode('idle','冲突已在原型中解除'),'danger'],['打开今日日记',()=>toast('模拟打开今日日记')]]))}function invalid(p){p.append(timerHead('计时不可用'),notice('simple-time-tracker 格式有误','原文保持不变。修复 JSON 后，Time Grid 会重新读取计时状态。',null,[['打开今日日记',()=>toast('模拟打开今日日记')]]))}function writeError(p){p.append(timerHead('写入失败'),notice('日记在写入前发生变化','没有覆盖新的内容。重新读取后可以安全重试。',null,[['重新读取并重试',()=>{state.startedAt=Date.now()-480000;setMode('running','已重新读取 · 原型模拟')}],['打开今日日记',()=>toast('模拟打开今日日记')]]))}
function recovery(p){p.append(timerHead('跨日恢复'),notice('“写代码”已持续 2天 11h','补齐将拆分计时并创建 2 篇缺失日记。确认前不会修改任何文件。',[['8月1日','结束于 24:00'],['8月2日','记录 24h'],['8月3日','从 00:00 继续']],[['补齐并继续',()=>{state.activity='写代码';state.startedAt=Date.now()-39600000;setMode('running','跨日记录已在原型中补齐')},'primary'],['首个午夜结束',()=>setMode('idle','计时已在首个午夜结束')],['暂不处理',()=>toast('未修改任何内容')]]))}function setMode(mode,message){state.timerState=mode;$('#stateSelect').value=mode;render();toast(message)}
function activitySection(root){const section=h('section'),total=activities.reduce((s,x)=>s+x.mins,0);section.appendChild(head('今日去向',`累计 ${duration(total)}`));const bar=h('div','activity-bar');activities.forEach(x=>{const seg=h('div','activity-segment');seg.style.width=`${x.mins/total*100}%`;seg.style.background=x.color;seg.title=`${x.name} · ${duration(x.mins)}`;bar.appendChild(seg)});section.appendChild(bar);const list=h('div','activity-list');activities.forEach(x=>{const row=h('div','activity-row'),swatch=h('i','activity-swatch'),name=h('div','activity-name',x.name);swatch.style.background=x.color;if(x.running&&['running','switched'].includes(state.timerState))name.appendChild(h('i','live-dot'));row.append(swatch,name,h('div','activity-value',`${duration(x.mins)} · ${Math.round(x.mins/total*100)}%`));list.appendChild(row)});section.appendChild(list);const status=h('div','status-line');if(['running','switched'].includes(state.timerState))status.append(h('i','live-dot'),document.createTextNode('1 段进行中 · 实时更新'));else status.textContent='共 6 段计时';section.appendChild(status);root.appendChild(section)}
function render(){const root=$('#timeView'),now=new Date();root.innerHTML='';renderContext(root,now);nowZone(root,now);activitySection(root)}
function tick(){const now=new Date(),oldDial=$('.dial-svg'),clockEl=$('.dial-clock'),summary=$('.dial-summary'),elapsedEl=$('.timer-elapsed');if(oldDial)oldDial.replaceWith(dial(now));if(clockEl)clockEl.textContent=clock(now);if(summary){const sec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds(),remain=86400-sec;summary.textContent=`今天已过 ${Math.floor(sec/864)}% · 还剩 ${Math.floor(remain/3600)}h ${Math.floor(remain%3600/60)}m`}if(elapsedEl)elapsedEl.textContent=elapsed(now-state.startedAt)}
function focusTimer(){const panel=$('.timer-panel'),viewport=$('#viewport');if(panel&&viewport)viewport.scrollTo({top:Math.max(0,panel.offsetTop-190),behavior:'smooth'})}
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{state.width=Number(b.dataset.width);document.querySelectorAll('[data-width]').forEach(x=>x.classList.toggle('is-active',x===b));$('#viewport').style.width=`${state.width}px`});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('is-active',x===b));document.body.classList.toggle('theme-light',state.theme==='light')});$('#stateSelect').onchange=e=>{state.timerState=e.target.value;if(['running','switched'].includes(state.timerState))state.startedAt=Date.now()-(state.timerState==='switched'?720000:2820000);render();requestAnimationFrame(focusTimer)};
document.querySelectorAll('[data-width]').forEach(b=>b.classList.toggle('is-active',Number(b.dataset.width)===state.width));document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('is-active',b.dataset.theme===state.theme));$('#viewport').style.width=`${state.width}px`;document.body.classList.toggle('theme-light',state.theme==='light');$('#stateSelect').value=state.timerState;
render();if(params.get('focus')==='timer')requestAnimationFrame(focusTimer);setInterval(()=>{if(document.visibilityState==='visible')tick()},1000);
</script>
