<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.compat.js?v=3"></script>
<style>
html,body{margin:0;height:100%;background:#0d0d0d;font-family:var(--font-ui)}
.demo-toolbar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#161616;border-bottom:1px solid #262626;color:#999;font-size:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.demo-toolbar button{font:inherit;padding:5px 10px;border-radius:6px;border:1px solid #333;background:#1c1c1c;color:#ccc;cursor:pointer}
.demo-toolbar button[data-active="true"]{background:#3a3252;border-color:#8974d3;color:#fff}
.demo-stage{display:flex;justify-content:center;padding:24px;min-height:calc(100% - 46px);box-sizing:border-box}
.sidebar-chrome{width:var(--stage-w,420px);background:var(--surface-app);border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle);transition:width .2s ease;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sidebar-tabbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border-subtle);color:var(--text-faint);font-size:11px}
.task-center{container-type:inline-size;padding:12px;max-height:820px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;position:relative;scrollbar-gutter:stable}

/* segmented switcher */
.tg-switcher{display:flex;background:var(--surface-sunken);border-radius:var(--radius-md);padding:3px;gap:3px}
.tg-switcher button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;border:0;border-radius:6px;background:transparent;color:var(--text-muted);font-size:var(--text-sm);cursor:pointer;font-family:inherit}
.tg-switcher button[aria-selected="true"]{background:var(--surface-panel);color:var(--text-primary);box-shadow:0 1px 2px rgba(0,0,0,.2)}

.tc-header-title{font-size:var(--text-xl);font-weight:700;color:var(--text-primary);margin:0}
.tc-header-sub{font-size:var(--text-sm);color:var(--text-faint);margin:2px 0 0}
.tc-refresh{width:30px;height:30px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-panel);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tc-refresh[data-spinning="true"] svg{animation:tg-spin 0.9s linear infinite}
@keyframes tg-spin{to{transform:rotate(360deg)}}

.tc-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@container (min-width: 560px){.tc-stats{grid-template-columns:repeat(4,1fr)}}

.tc-search-row{display:flex;gap:8px}
.tc-search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface-panel);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:0 10px;height:36px}
.tc-search input{flex:1;border:0;background:transparent;color:var(--text-primary);font:inherit;font-size:var(--text-sm);outline:none;min-width:0}
.tc-search input::placeholder{color:var(--text-faint)}
.tc-search button{border:0;background:transparent;color:var(--text-faint);cursor:pointer;flex:0 0 auto;width:20px;height:20px}
.tc-filter-btn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:var(--radius-md);border:1px solid var(--border-default);background:var(--surface-panel);color:var(--text-muted);font-size:var(--text-sm);cursor:pointer;flex:0 0 auto;position:relative;white-space:nowrap}
@container (max-width:520px){.tc-search-row{flex-wrap:wrap}.tc-search{flex:1 0 100%;width:100%}.tc-filter-btn{width:max-content}}
@container (max-width:320px){.task-center{padding:8px}.tc-stats{gap:6px}.tc-header-sub{display:none}}
.tc-filter-badge{background:var(--tg-accent);color:#fff;border-radius:999px;font-size:9px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.tc-chip-row{display:flex;gap:6px;flex-wrap:wrap}
.tc-chip{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:var(--radius-pill);border:1px solid var(--border-default);background:var(--surface-panel);color:var(--text-muted);font-size:var(--text-xs);cursor:pointer}
.tc-chip[data-active="true"]{border-color:var(--tg-accent);color:var(--tg-accent);background:color-mix(in srgb,var(--tg-accent) 10%,transparent)}

.tc-sections{display:flex;flex-direction:column;gap:14px}
.tc-section{display:flex;flex-direction:column;gap:8px}
.tc-section-body{display:flex;flex-direction:column;gap:8px}
.tc-future-group{font-size:var(--text-xs);color:var(--text-faint);display:flex;align-items:center;gap:6px;margin-top:4px}
.tc-future-group::before{content:"";width:10px;height:1px;background:var(--border-default)}

.tc-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;text-align:center;color:var(--text-faint);font-size:var(--text-sm);border:1px dashed var(--border-default);border-radius:var(--radius-md)}
.tc-empty button{border:0;background:transparent;color:var(--tg-accent);cursor:pointer;font:inherit;text-decoration:underline}
.tc-skeleton{height:64px;border-radius:var(--radius-md);background:linear-gradient(90deg,var(--surface-panel) 25%,var(--surface-hover) 50%,var(--surface-panel) 75%);background-size:200% 100%;animation:tg-shimmer 1.4s ease infinite;border:1px solid var(--border-subtle)}
@keyframes tg-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* popovers/menus */
.tg-overlay-backdrop{position:fixed;inset:0;background:transparent;z-index:90}
.tg-menu{position:absolute;z-index:100;min-width:190px;background:var(--surface-overlay);border:1px solid var(--border-default);border-radius:10px;box-shadow:var(--shadow-menu);padding:6px;display:flex;flex-direction:column}
.tg-menu-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;border:0;background:transparent;color:var(--text-primary);font-size:var(--text-sm);cursor:pointer;text-align:left;font-family:inherit}
.tg-menu-item:hover,.tg-menu-item:focus-visible{background:var(--surface-hover)}
.tg-menu-item[data-danger="true"]{color:var(--tg-status-overdue)}
.tg-menu-sep{height:1px;background:var(--border-subtle);margin:5px 2px}
.tg-menu-check{width:14px;color:var(--tg-accent)}

.tg-popover{position:absolute;z-index:100;background:var(--surface-overlay);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-popover);padding:12px;width:260px}
.tg-popover h4{margin:0 0 6px;font-size:var(--text-xs);color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em}
.tg-popover-group{margin-bottom:12px}
.tg-popover-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border-subtle);padding-top:10px;margin-top:4px}
.tg-popover-footer button{border:0;background:transparent;font:inherit;font-size:var(--text-xs);cursor:pointer;color:var(--text-muted)}
.tg-popover-footer .tg-primary{color:var(--tg-accent);font-weight:600}

.tg-hover-preview{position:fixed;z-index:200;width:280px;background:var(--surface-overlay);border:1px solid var(--border-default);border-radius:10px;box-shadow:var(--shadow-popover);padding:12px;font-size:var(--text-xs);color:var(--text-muted);display:flex;flex-direction:column;gap:6px}
.tg-hover-preview strong{color:var(--text-primary);font-size:var(--text-sm);font-weight:600}

.tc-touch-expand{background:var(--surface-sunken);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:var(--text-xs);color:var(--text-muted);display:flex;flex-direction:column;gap:4px}

/* reserved daily-routine composition; production data wiring is intentionally deferred */
.tc-routine-group{border:1px solid color-mix(in srgb,var(--tg-status-today) 32%,var(--border-default));border-radius:var(--radius-md);background:color-mix(in srgb,var(--tg-status-today) 5%,var(--surface-panel));overflow:hidden}
.tc-routine-summary{appearance:none;width:100%;min-height:48px;padding:8px 10px;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--text-primary);font-family:inherit;text-align:left;cursor:pointer}
.tc-routine-icon{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 26px;border-radius:7px;background:color-mix(in srgb,var(--tg-status-today) 14%,transparent);color:var(--tg-status-today)}
.tc-routine-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:2px}.tc-routine-copy strong{font-size:var(--text-sm)}.tc-routine-copy small{font-size:var(--text-2xs);color:var(--text-faint)}
.tc-routine-progress{font:600 var(--text-xs)/1 var(--font-mono);color:var(--tg-status-today);white-space:nowrap}.tc-routine-chevron{color:var(--text-faint);transition:transform .12s ease}.tc-routine-chevron[data-expanded="false"]{transform:rotate(-90deg)}
.tc-routine-items{display:flex;flex-direction:column;gap:2px;padding:2px 10px 9px 44px}.tc-routine-item{display:flex;align-items:center;gap:7px;min-height:28px;min-width:0}.tc-routine-check{width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 15px;border:1px solid var(--border-default);border-radius:4px;font-size:10px;color:var(--text-on-accent)}.tc-routine-check[data-done="true"]{background:var(--tg-status-done);border-color:var(--tg-status-done)}.tc-routine-title{min-width:0;font-size:var(--text-xs);color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tc-routine-title[data-done="true"]{color:var(--text-muted);text-decoration:line-through}

.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.tc-skeleton,.tc-refresh svg,*{animation-duration:0.001s !important;transition-duration:0.001s !important}}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { TaskCard, StatCard, SectionHeader, Icon } = window.TimeGridDesignSystem_80c9b5;

const TASKS = {
  overdue: [
    { id:'o1', title:'修好日历同步脚本，之前跑丢了三天的数据需要重新核对', status:'todo', due:'8月3日 · 逾期3天', priority:'P1', src:'Projects/Infra.md · L42' },
  ],
  today: [
    { id:'t1', title:'Golf', status:'todo', due:'今天', src:'Daily/2026-08-01.md · L3' },
    { id:'t2', title:'Review the onboarding funnel copy end to end before ship', status:'doing', due:'今天', priority:'P2', src:'Work/Onboarding.md · L18' },
  ],
  triage: [
    { id:'r1', title:'Recurring standup notes', status:'todo', readonly:true, reason:'循环任务 · 只读', src:'Daily/template.md · L2' },
    { id:'r2', title:'Hotel #goal', status:'todo', src:'Travel/Plan.md · L9' },
    { id:'r3', title:'Book flights', status:'todo', src:'Travel/Plan.md · L11' },
    { id:'r4', title:'Malformed date field — 2026-02-31', status:'unknown', readonly:true, reason:'格式异常 · 只读', src:'Notes/Scratch.md · L77' },
  ],
  longterm: [
    { id:'l1', title:'学习中提琴', status:'todo', tag:'#goal', src:'Goals/2026.md · L4' },
    { id:'l2', title:'写一本关于时间感知的小书', status:'todo', src:'Goals/2026.md · L9' },
  ],
  future: {
    tomorrow: [{ id:'f1', title:'Whiskey concurrent', status:'todo', due:'明天', src:'Daily/2026-08-02.md · L5' }],
    week: [{ id:'f2', title:'Xray', status:'todo', due:'8月5日', src:'Daily/2026-08-05.md · L2' }],
    later: [
      { id:'f3', title:'Yankee', status:'todo', due:'8月12日', src:'Notes/Y.md · L1' },
      { id:'f4', title:'Zulu', status:'todo', due:'8月20日', src:'Notes/Z.md · L1' },
    ],
  },
  ended: [
    { id:'e1', title:'Alpha', status:'done', src:'Daily/2026-07-28.md · L1' },
    { id:'e2', title:'Bravo', status:'done', src:'Daily/2026-07-28.md · L2' },
    { id:'e3', title:'Cancelled export job', status:'cancelled', src:'Daily/2026-07-27.md · L6' },
  ],
};
const SECTION_META = {
  overdue: { title:'逾期', subtitle:'需要重新安排', icon:'!', accent:'--tg-status-overdue', fixed:true },
  today: { title:'今天', subtitle:'今天要推进', icon:'☼', accent:'--tg-status-today', fixed:true },
  triage: { title:'待分类', subtitle:'尚未安排日期', icon:'▤', accent:'--tg-status-triage' },
  longterm: { title:'长期', subtitle:'长期方向与目标', icon:'▲', accent:'--tg-status-longterm' },
  future: { title:'未来', subtitle:'接下来的安排', icon:'→', accent:'--tg-status-future' },
  ended: { title:'已结束', subtitle:'已完成与已取消', icon:'▣', accent:'--tg-status-done' },
};

function countAll(){
  const flat = [...TASKS.overdue, ...TASKS.today, ...TASKS.triage, ...TASKS.longterm, ...TASKS.future.tomorrow, ...TASKS.future.week, ...TASKS.future.later, ...TASKS.ended];
  return { total: flat.length, overdue: TASKS.overdue.length, today: TASKS.today.length, active: flat.filter(t=>t.status==='todo'||t.status==='doing').length };
}

function StatusMenu({ x, y, current, onPick, onClose }){
  const items = [ ['todo','待办','○'], ['doing','进行中','◐'], ['done','完成','●'], ['cancelled','取消','✕'] ];
  return <React.Fragment>
    <div className="tg-overlay-backdrop" onClick={onClose} />
    <div className="tg-menu" role="menu" style={{ top:y, left:x }}>
      {items.map(([val,label,glyph]) => (
        <button key={val} role="menuitemradio" aria-checked={current===val} className="tg-menu-item" onClick={()=>{onPick(val);onClose();}}>
          <span style={{width:16}}>{glyph}</span>{label}<span style={{marginLeft:'auto'}} className="tg-menu-check">{current===val?'✓':''}</span>
        </button>
      ))}
    </div>
  </React.Fragment>;
}

function MoreMenu({ x, y, task, onClose, onAction }){
  if (task.readonly) return <React.Fragment>
    <div className="tg-overlay-backdrop" onClick={onClose} />
    <div className="tg-menu" role="menu" style={{ top:y, left:x }}>
      <button className="tg-menu-item" role="menuitem" onClick={()=>{onAction('reason');onClose();}}>ⓘ 查看只读原因</button>
      <button className="tg-menu-item" role="menuitem" onClick={()=>{onAction('open');onClose();}}>↗ 打开源文件</button>
    </div>
  </React.Fragment>;
  return <React.Fragment>
    <div className="tg-overlay-backdrop" onClick={onClose} />
    <div className="tg-menu" role="menu" style={{ top:y, left:x }}>
      <button className="tg-menu-item" role="menuitem" onClick={()=>{onAction('edit');onClose();}}>✎ 编辑任务</button>
      <div className="tg-menu-sep" />
      {task.due && <button className="tg-menu-item" role="menuitem" onClick={()=>{onAction('postpone1');onClose();}}>» 顺延一天</button>}
      {task.due && <button className="tg-menu-item" role="menuitem" onClick={()=>{onAction('postpone7');onClose();}}>» 顺延一周</button>}
      {!task.due && <button className="tg-menu-item" role="menuitem" onClick={()=>{onAction('today');onClose();}}>☼ 设为今天</button>}
      {!task.due && <button className="tg-menu-item" role="menuitem" onClick={()=>{onAction('longterm');onClose();}}>▲ 设为长期</button>}
      <div className="tg-menu-sep" />
      <button className="tg-menu-item" role="menuitem" onClick={()=>{onAction('open');onClose();}}>↗ 打开源文件</button>
      <div className="tg-menu-sep" />
      <button className="tg-menu-item" role="menuitem" data-danger="true" onClick={()=>{onAction('delete');onClose();}}>🗑 删除任务</button>
    </div>
  </React.Fragment>;
}

function FilterPopover({ onClose }){
  return <React.Fragment>
    <div className="tg-overlay-backdrop" onClick={onClose} />
    <div className="tg-popover" style={{ top:96, right:16 }}>
      <div className="tg-popover-group">
        <h4>状态</h4>
        <div className="tc-chip-row">{['待办','进行中','完成','取消','未知'].map(s=><span key={s} className="tc-chip">{s}</span>)}</div>
      </div>
      <div className="tg-popover-group">
        <h4>优先级</h4>
        <div className="tc-chip-row">{['最高','高','中','低','无'].map(s=><span key={s} className="tc-chip">{s}</span>)}</div>
      </div>
      <div className="tg-popover-group">
        <h4>来源文件</h4>
        <div style={{maxHeight:90,overflowY:'auto',display:'flex',flexDirection:'column',gap:4}}>
          {['Daily/2026-08-01.md','Goals/2026.md','Projects/Infra.md','Travel/Plan.md'].map(f=><label key={f} style={{display:'flex',gap:6,fontSize:11,color:'var(--text-muted)',alignItems:'center'}}><input type="checkbox" />{f}</label>)}
        </div>
      </div>
      <div className="tg-popover-footer">
        <button>清除全部</button>
        <button className="tg-primary" onClick={onClose}>完成</button>
      </div>
    </div>
  </React.Fragment>;
}

function HoverPreview({ x, y, task }){
  return <div className="tg-hover-preview" style={{ top:y, left:x }} role="tooltip">
    <strong>{task.title}</strong>
    <span>状态：{({todo:'待办',doing:'进行中',done:'完成',cancelled:'取消',unknown:'未知状态'})[task.status]}</span>
    {task.due && <span>到期：{task.due}</span>}
    {task.priority && <span>优先级：{task.priority}</span>}
    <span>来源：{task.src}</span>
    {task.readonly && <span style={{color:'var(--tg-status-readonly)'}}>只读原因：{task.reason}</span>}
  </div>;
}

function TaskRow({ task, accent, touchMode, onStatusMenu, onMoreMenu, onHover, writing = false }){
  const [expanded, setExpanded] = React.useState(false);
  const ref = React.useRef(null);
  return (
    <div ref={ref}>
      <TaskCard
        title={task.title} status={task.status} accentColor={accent} dueDate={task.due}
        overdue={task.due && task.due.includes('逾期')} priority={task.priority}
        readonly={task.readonly} readonlyReason={task.reason}
        writing={writing}
        onToggle={()=>{}}
        onMore={(e)=>onMoreMenu(e, task)}
        onStatus={(e)=>!task.readonly && onStatusMenu(e, task)}
        onTitleClick={touchMode ? ()=>setExpanded(v=>!v) : undefined}
        onEdit={!touchMode && !task.readonly ? ()=>{} : undefined}
        onPostpone={!touchMode && !task.readonly && task.due ? ()=>{} : undefined}
      />
      {!touchMode && !task.readonly && (
        <span
          style={{ display:'none' }}
          onMouseEnter={(e)=>onHover(e, task)}
        />
      )}
      {expanded && touchMode && (
        <div className="tc-touch-expand">
          <div><strong style={{color:'var(--text-primary)'}}>{task.title}</strong></div>
          <div>来源：{task.src}</div>
          {task.readonly && <div style={{color:'var(--tg-status-readonly)'}}>只读原因：{task.reason}</div>}
        </div>
      )}
    </div>
  );
}

function RoutineGroup({ touchMode }){
  const [expanded, setExpanded] = React.useState(true);
  const items = [
    { id:'routine-1', title:'吃药（补肾益肝）', done:true },
    { id:'routine-2', title:'米诺地尔', done:true },
    { id:'routine-3', title:'今日 AI 资讯', done:false },
    { id:'routine-4', title:'Leetcode 5 道', done:false },
    { id:'routine-5', title:'轻听英语 3 篇文章', done:false },
  ];
  const completed = items.filter(item=>item.done).length;
  return <div className="tc-routine-group">
    <button className="tc-routine-summary" aria-expanded={expanded} onClick={()=>setExpanded(v=>!v)}>
      <span className="tc-routine-icon" aria-hidden="true">↻</span>
      <span className="tc-routine-copy"><strong>每日流程</strong><small>今天的固定例行事项</small></span>
      <span className="tc-routine-progress">{completed} / {items.length}</span>
      <span className="tc-routine-chevron" data-expanded={expanded}>⌄</span>
    </button>
    {expanded && <div className="tc-routine-items">
      {items.map(item=><div className="tc-routine-item" key={item.id}>
        <span className="tc-routine-check" data-done={item.done}>{item.done?'✓':''}</span>
        <span className="tc-routine-title" data-done={item.done}>{item.title}</span>
      </div>)}
    </div>}
  </div>;
}

function Section({ id, tasks, matchTasks, collapsedMap, setCollapsedMap, touchMode, onStatusMenu, onMoreMenu, onHover, writingTaskId }){
  const meta = SECTION_META[id];
  const flat = id === 'future' ? [...tasks.tomorrow, ...tasks.week, ...tasks.later] : tasks;
  const total = flat.length;
  const match = matchTasks ? (id === 'future' ? matchTasks.tomorrow.length+matchTasks.week.length+matchTasks.later.length : matchTasks.length) : total;
  const collapsed = !meta.fixed && collapsedMap[id];
  return (
    <div className="tc-section">
      <SectionHeader icon={meta.icon} title={meta.title} subtitle={meta.subtitle} count={total} matchCount={match} accentColor={meta.accent}
        fixed={meta.fixed} collapsed={collapsed} onToggle={()=>setCollapsedMap(m=>({...m,[id]:!m[id]}))} />
      {!collapsed && (
        <div className="tc-section-body">
          {id === 'today' && <RoutineGroup touchMode={touchMode} />}
          {total === 0 && (
            <div className="tc-empty">
              <span>{id==='overdue' ? '太棒了，没有逾期任务' : '这个分区还没有任务'}</span>
              {id==='triage' && <span>在任意笔记里写 <code>- [ ] 内容</code>，即可被 Time Grid 汇总</span>}
            </div>
          )}
          {id !== 'future' ? flat.map(t => (
            <TaskRow key={t.id} task={t} accent={meta.accent} touchMode={touchMode} writing={writingTaskId===t.id} onStatusMenu={onStatusMenu} onMoreMenu={onMoreMenu} onHover={onHover} />
          )) : (
            <React.Fragment>
              {tasks.tomorrow.length>0 && <div className="tc-future-group">明天 {tasks.tomorrow.length}</div>}
              {tasks.tomorrow.map(t=><TaskRow key={t.id} task={t} accent={meta.accent} touchMode={touchMode} writing={writingTaskId===t.id} onStatusMenu={onStatusMenu} onMoreMenu={onMoreMenu} onHover={onHover} />)}
              {tasks.week.length>0 && <div className="tc-future-group">7 天内 {tasks.week.length}</div>}
              {tasks.week.map(t=><TaskRow key={t.id} task={t} accent={meta.accent} touchMode={touchMode} writing={writingTaskId===t.id} onStatusMenu={onStatusMenu} onMoreMenu={onMoreMenu} onHover={onHover} />)}
              {tasks.later.length>0 && <div className="tc-future-group">更晚 {tasks.later.length}</div>}
              {tasks.later.map(t=><TaskRow key={t.id} task={t} accent={meta.accent} touchMode={touchMode} writing={writingTaskId===t.id} onStatusMenu={onStatusMenu} onMoreMenu={onMoreMenu} onHover={onHover} />)}
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
}

function TaskCenter({ touchMode, uiState }){
  const [view, setView] = React.useState('task');
  const [search, setSearch] = React.useState('');
  const [collapsedMap, setCollapsedMap] = React.useState({ triage:true, longterm:false, future:false, ended:true });
  const [filterOpen, setFilterOpen] = React.useState(false);
  const [refreshing, setRefreshing] = React.useState(false);
  const [statusMenu, setStatusMenu] = React.useState(null);
  const [moreMenu, setMoreMenu] = React.useState(null);
  const [hover, setHover] = React.useState(null);
  const stats = countAll();

  if (uiState === 'loading') {
    return <div className="task-center">
      <div className="tg-switcher" role="tablist"><button role="tab" aria-selected="false">⏱ 时间</button><button role="tab" aria-selected="true">☰ 任务</button></div>
      <div className="tc-stats">{[1,2,3,4].map(i=><div key={i} className="tc-skeleton" style={{height:56}} />)}</div>
      {[1,2,3].map(i=><div key={i} className="tc-skeleton" />)}
    </div>;
  }
  if (uiState === 'empty-vault') {
    return <div className="task-center">
      <div className="tg-switcher" role="tablist"><button role="tab" aria-selected="false">⏱ 时间</button><button role="tab" aria-selected="true">☰ 任务</button></div>
      <h2 className="tc-header-title">任务中心</h2>
      <div className="tc-empty" style={{padding:'40px 16px'}}>
        <strong style={{color:'var(--text-primary)'}}>还没有任务</strong>
        <span>在任意笔记里写 <code>- [ ] 内容</code>，即可被 Time Grid 汇总。</span>
      </div>
    </div>;
  }

  const noResults = uiState === 'no-results' || (search.length > 0 && !'golf review'.includes(search.toLowerCase()) && search !== '');

  return (
    <div className="task-center">
      <div className="tg-switcher" role="tablist" aria-label="时间或任务视图">
        <button role="tab" aria-selected={view==='time'} onClick={()=>setView('time')}>⏱ 时间</button>
        <button role="tab" aria-selected={view==='task'} onClick={()=>setView('task')}>☰ 任务</button>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div><h2 className="tc-header-title">任务中心</h2><p className="tc-header-sub">聚焦现在，轻松安排接下来</p></div>
        <button className="tc-refresh" data-spinning={refreshing} aria-label="刷新任务索引" aria-busy={refreshing}
          onClick={()=>{setRefreshing(true);setTimeout(()=>setRefreshing(false),900);}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 4v6h6M20 20v-6h-6M4.5 15a8 8 0 0013.9 3.4M19.5 9a8 8 0 00-13.9-3.4" /></svg>
        </button>
      </div>
      <div className="tc-stats">
        <StatCard icon="☰" value={stats.total} label="总任务" />
        <StatCard icon="!" value={stats.overdue} label="逾期" accentColor="--tg-status-overdue" />
        <StatCard icon="☼" value={stats.today} label="今天" accentColor="--tg-status-today" />
        <StatCard icon="∿" value={stats.active} label="活跃" accentColor="--tg-status-done" />
      </div>
      <div className="tc-search-row">
        <div className="tc-search">
          <span aria-hidden="true" style={{color:'var(--text-faint)'}}>⌕</span>
          <label htmlFor="tc-search-input" className="visually-hidden">搜索任务、标签或文件</label>
          <input id="tc-search-input" placeholder="搜索任务、标签或文件…" value={search} onChange={e=>setSearch(e.target.value)} />
          {search && <button aria-label="清空搜索" onClick={()=>setSearch('')}>✕</button>}
        </div>
        <button className="tc-filter-btn" aria-haspopup="dialog" onClick={()=>setFilterOpen(v=>!v)}>
          <Icon name="month" size={14} />筛选<span className="tc-filter-badge">2</span>
        </button>
      </div>
      {noResults ? (
        <div className="tc-empty" style={{padding:'34px 16px'}}>
          <strong style={{color:'var(--text-primary)'}}>没有匹配的任务</strong>
          <span>试试其他关键词</span>
          <button onClick={()=>setSearch('')}>清空搜索</button>
        </div>
      ) : (
        <div className="tc-sections">
          {Object.keys(SECTION_META).map(id => (
            <Section key={id} id={id} tasks={TASKS[id]} matchTasks={null} collapsedMap={collapsedMap} setCollapsedMap={setCollapsedMap}
              touchMode={touchMode}
              writingTaskId={uiState==='writing' ? 't1' : undefined}
              onStatusMenu={(e,t)=>{const r=e.currentTarget.getBoundingClientRect();setStatusMenu({x:r.left,y:r.bottom+4,task:t});}}
              onMoreMenu={(e,t)=>{const r=e.currentTarget.getBoundingClientRect();setMoreMenu({x:Math.min(r.left,300),y:r.bottom+4,task:t});}}
              onHover={(e,t)=>{const r=e.currentTarget.getBoundingClientRect();setHover({x:r.right+8,y:r.top,task:t});}}
            />
          ))}
        </div>
      )}
      {filterOpen && <FilterPopover onClose={()=>setFilterOpen(false)} />}
      {moreMenu && <MoreMenu x={moreMenu.x} y={moreMenu.y} task={moreMenu.task} onClose={()=>setMoreMenu(null)} onAction={()=>{}} />}
      {statusMenu && <StatusMenu x={statusMenu.x} y={statusMenu.y} current={statusMenu.task.status} onPick={()=>{}} onClose={()=>setStatusMenu(null)} />}
      {hover && <HoverPreview x={hover.x} y={hover.y} task={hover.task} />}
    </div>
  );
}

function Demo(){
  const [width, setWidth] = React.useState(420);
  const [theme, setTheme] = React.useState('dark');
  const [touchMode, setTouchMode] = React.useState(false);
  const [uiState, setUiState] = React.useState('normal');

  return <React.Fragment>
    <div className="demo-toolbar">
      <span>宽度</span>
      {[280,420,720].map(w => <button key={w} data-active={width===w} onClick={()=>setWidth(w)}>{w}px</button>)}
      <span style={{marginLeft:12}}>主题</span>
      <button data-active={theme==='dark'} onClick={()=>setTheme('dark')}>深色</button>
      <button data-active={theme==='light'} onClick={()=>setTheme('light')}>浅色</button>
      <span style={{marginLeft:12}}>输入</span>
      <button data-active={!touchMode} onClick={()=>setTouchMode(false)}>桌面</button>
      <button data-active={touchMode} onClick={()=>setTouchMode(true)}>触屏</button>
      <span style={{marginLeft:12}}>状态</span>
      {[['normal','正常'],['loading','加载中'],['empty-vault','无任务'],['no-results','无结果'],['writing','写入中']].map(([v,l])=><button key={v} data-active={uiState===v} onClick={()=>setUiState(v)}>{l}</button>)}
    </div>
    <div className="demo-stage">
      <div className={theme==='light' ? 'theme-light sidebar-chrome' : 'sidebar-chrome'} style={{ '--stage-w': width+'px' }}>
        <div className="sidebar-tabbar">🕐 Time Grid</div>
        <TaskCenter key={width+theme+touchMode+uiState} touchMode={touchMode} uiState={uiState} />
      </div>
    </div>
  </React.Fragment>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
