<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
html,body{margin:0;height:100%;background:#101010;font-family:var(--font-ui)}
.obsidian-chrome{display:flex;justify-content:center;padding:24px 0;min-height:100%;box-sizing:border-box}
.sidebar{width:320px;background:var(--surface-app);border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle)}
.sidebar-tabbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border-subtle);color:var(--text-faint);font-size:11px}
.tg-container{padding:12px;max-height:820px;overflow-y:auto}
.tg-wrapper{display:flex;flex-direction:column;gap:12px}
</style>
</head><body>
<div class="obsidian-chrome">
<div class="sidebar">
<div class="sidebar-tabbar">🕐 Time Grid</div>
<div class="tg-container"><div class="tg-wrapper" id="root"></div></div>
</div>
</div>
<script type="text/babel">
const { TimeHeatmap, MonthHeatmap, DayGrid, HourGrid, DailyPieChart } = window.TimeGridDesignSystem_80c9b5;

function Panel(){
  const [now, setNow] = React.useState(new Date());
  React.useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  return (
    <React.Fragment>
      <TimeHeatmap now={now} weeks={24} />
      <MonthHeatmap now={now} />
      <DayGrid now={now} />
      <HourGrid now={now} />
      <DailyPieChart />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Panel />);
</script>
</body></html>
