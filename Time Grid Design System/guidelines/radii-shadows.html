<!-- @dsCard group="Brand" viewport="700x170" name="Radii & Shadow" subtitle="8px panels, 4px cells, pill legends, one soft tooltip shadow" -->
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-app);padding:20px;display:flex;gap:20px;align-items:center;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.box{background:var(--surface-panel);border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;color:var(--text-primary)}
</style>
</head><body>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div class="box" style="width:70px;height:60px;border-radius:8px"></div>radius-md 8px (panel)</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div class="box" style="width:40px;height:40px;border-radius:4px"></div>radius-sm 4px (cell)</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div class="box" style="width:70px;height:24px;border-radius:999px"></div>radius-pill (legend bar)</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div class="box" style="width:90px;height:40px;border-radius:7px;box-shadow:var(--shadow-tooltip)">tooltip</div>shadow-tooltip</div>
</body></html>
