<!-- @dsCard group="Colors" viewport="700x200" name="Semantic Surfaces & Accent" subtitle="Panel chrome tokens as used in the sidebar" -->
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-ui);padding:16px;display:flex;gap:12px}
.card{background:var(--surface-panel);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:12px;flex:1;color:var(--text-primary);font-size:12px}
.muted{color:var(--text-muted);font-size:11px;margin-top:4px}
.dot{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:middle;margin-right:6px}
</style>
</head><body>
<div class="card">surface-app / surface-panel<div class="muted">app bg vs. module chrome</div></div>
<div class="card"><span class="dot" style="background:var(--tg-accent)"></span>--tg-accent<div class="muted">today ring, current-cell border</div></div>
<div class="card"><span class="dot" style="background:var(--tg-today-ring)"></span>--tg-today-ring<div class="muted">gold "today" outline</div></div>
<div class="card" style="border-color:var(--border-subtle)">border-default / border-subtle<div class="muted">module & divider strokes</div></div>
</body></html>
